name: diag-live
on:
  push:
    paths:
      - ".diag-trigger"
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Collecte
        run: |
          {
            echo "### /dashboard : structure"
            curl -sS -o /tmp/dash.html https://campusly-one.vercel.app/dashboard
            echo "taille=$(wc -c < /tmp/dash.html)"
            grep -o 'class="app-shell"' /tmp/dash.html | head -1
            grep -o 'class="app-layout"' /tmp/dash.html | head -1
            echo "demo-banner dans app-layout ? $(python3 -c "
          html=open('/tmp/dash.html',encoding='utf-8',errors='replace').read()
          i=html.find('app-layout'); j=html.find('demo-banner')
          print('oui' if (i!=-1 and j!=-1 and -1 < j-i < 400) else 'non')
          ")"
            echo "### CSS référencés par /dashboard et leur statut"
            for u in $(grep -oE '/_next/static/css/[A-Za-z0-9]+\.css' /tmp/dash.html | sort -u); do
              printf '%s -> ' "$u"; curl -sS -o /dev/null -w '%{http_code} %{size_download}o\n' "https://campusly-one.vercel.app$u"
            done
            echo "### règle .app-shell présente dans le CSS servi ?"
            for u in $(grep -oE '/_next/static/css/[A-Za-z0-9]+\.css' /tmp/dash.html | sort -u); do
              body=$(curl -sS "https://campusly-one.vercel.app$u")
              case "$body" in *".app-shell{"*|*"app-shell{"*) echo "$u : OUI";; esac
            done
            echo "### pages"
            for p in /auth /dashboard /examen/ALGO1; do
              printf '%-20s ' "$p"; curl -sS -o /tmp/p.html -w '%{http_code} %{size_download}o\n' "https://campusly-one.vercel.app$p"
            done
          } > /tmp/diag.txt 2>&1
          python3 - <<'PY'
          import json, os, urllib.request
          body = open('/tmp/diag.txt', encoding='utf-8', errors='replace').read()[:60000]
          sha = os.environ['GITHUB_SHA']; repo = os.environ['GITHUB_REPOSITORY']; token = os.environ['GH_TOKEN']
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/commits/{sha}/comments",
              data=json.dumps({"body": "```\n" + body + "\n```"}).encode(),
              headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json", "Content-Type": "application/json"},
              method="POST")
          print(urllib.request.urlopen(req).status)
          PY
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
