<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hors ligne — Campusly 2.0</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: #090A0F;
      color: #F8FAFC;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .offline-container {
      background: #12131A;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      padding: 40px 28px;
      text-align: center;
      max-width: 460px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    }
    .logo-brand {
      margin-bottom: 20px;
      font-size: 1.4rem;
      font-weight: 900;
      color: #F8FAFC;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .logo-brand span { color: #F57C00; }
    .offline-icon {
      font-size: 3.5rem;
      color: #F57C00;
      margin-bottom: 20px;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    h1 {
      font-size: 1.6rem;
      font-weight: 800;
      color: #F8FAFC;
      margin-bottom: 10px;
    }
    p {
      color: #94A3B8;
      font-size: 0.92rem;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      background: #1565C0;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn:hover {
      background: #1976D2;
    }
    .tips {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid rgba(255,255,255,0.08);
      text-align: left;
    }
    .tips h3 {
      font-size: 0.85rem;
      font-weight: 700;
      color: #CBD5E1;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tips ul {
      list-style: none;
      padding: 0;
    }
    .tips li {
      font-size: 0.82rem;
      color: #94A3B8;
      padding: 5px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tips li i {
      color: #10B981;
      font-size: 0.75rem;
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <div class="logo-brand">
      <i class="fas fa-graduation-cap" style="color:#1565C0;"></i> Campus<span>ly</span>
    </div>
    <div class="offline-icon">
      <i class="fas fa-wifi"></i>
    </div>
    <h1>Vous êtes hors ligne</h1>
    <p>
      Impossible de se connecter à Campusly. Vérifiez votre connexion internet pour continuer à réviser.
    </p>
    <button class="btn" onclick="window.location.reload()">
      <i class="fas fa-rotate-right"></i> Réessayer
    </button>
    
    <div class="tips">
      <h3><i class="fas fa-lightbulb" style="color:#F57C00;"></i> Conseils</h3>
      <ul>
        <li><i class="fas fa-check"></i> Vérifiez votre connexion Wi-Fi ou données mobiles</li>
        <li><i class="fas fa-check"></i> Désactivez le mode avion si activé</li>
        <li><i class="fas fa-check"></i> Vos données seront synchronisées à la reconnexion</li>
      </ul>
    </div>
  </div>
  
  <script>
    setInterval(() => {
      if (navigator.onLine) {
        window.location.reload();
      }
    }, 5000);
    
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
